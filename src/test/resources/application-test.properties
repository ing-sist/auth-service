spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Auth0 test configuration
auth0.domain=dev-test.auth0.com
auth0.audience=https://test-api
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-test.auth0.com/
auth0.management.client-id=test-client-id
auth0.management.client-secret=test-client-secret
auth0.management.audience=https://dev-test.auth0.com/api/v2/