spring.application.name=auth-service
# Database connection settings
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Auth0 settings
auth0.audience=${AUTH0_AUDIENCE}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_SERVER_URI}
# Auth0 Management API Configuration (M2M for fetching user details)
auth0.domain=${AUTH0_DOMAIN}
auth0.management.client-id=${AUTH0_M2M_CLIENT_ID}
auth0.management.client-secret=${AUTH0_M2M_CLIENT_SECRET}
auth0.management.audience=${AUTH0_MANAGEMENT_AUDIENCE}